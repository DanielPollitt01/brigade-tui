[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brigade-tui"
version = "0.1.0"
description = "A read-only terminal view over a running software factory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=8,<9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

# uv syncs the default ``dev`` dependency group on ``uv run``, so plain
# ``uv run pytest`` works with no extra flags.
[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
brigade = "brigade_tui.app:main"

[tool.setuptools.packages.find]
include = ["brigade_tui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
